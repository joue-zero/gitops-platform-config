name: Validate manifests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v4.3.0
  KUBECONFORM_VERSION: v0.8.0
  KUBERNETES_VERSION: 1.33.0

jobs:
  validate:
    name: Validate Argo CD manifests and rendered environments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: joue-zero/gitops-platform
          ref: main
          path: app-repo

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C "$HOME/.local/bin" kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate Argo CD manifests against the CRD schemas
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            apps/

      - name: Render every environment against the chart
        run: |
          for env in envs/*/; do
            echo "==> $env"
            helm template gitops-app app-repo/helm/app -f "${env}values.yaml" --namespace app \
              | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" -
          done
